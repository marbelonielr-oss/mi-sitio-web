<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portafolio - Balbel Oniel</title>
<style>
    /* Estilos generales para centrar textos y dar un diseño limpio */
    body {
        font-family: Arial, sans-serif;
        text-align: center; /* Centra todo el texto de la página */
        background-color: #f4f4f9;
        margin: 0;
        padding: 0;
    }

    header {
        background-color: #2c3e50;
        color: white;
        padding: 30px 20px;
    }

    nav {
        background-color: #34495e;
        padding: 15px;
    }

    nav a {
        color: white;
        margin: 0 15px;
        text-decoration: none;
    }

    main {
        padding: 20px;
    }

    /* Centra la tarjeta en el medio de la pantalla */
    .card {
        background: white;
        max-width: 600px;
        margin: 30px auto; 
        padding: 25px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        text-align: center;
    }
</style>
</head>
<body>

<header>
    <h1>Mi Portafolio Web</h1>
    <p>Bienvenidos a mi espacio digital - Marbel Oniel</p>
</header>

<nav>
    <a href="#inicio">Inicio</a>
    <a href="#nosotros">Sobre mí</a>
    <a href="#servicios">Servicios</a>
    <a href="#contacto">Contacto</a>
</nav>

<main>
    <div class="card">
        <h2>Estudiante de Ingeniería en Sistemas</h2>
        <p>Soy estudiante de la carrera de Ingeniería en Sistemas, originario de Jaquimeyes. Aquí estaré compartiendo mis proyectos y avances en el desarrollo web.</p>
    </div>
</main>

</body>
</html>
